[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dagster-test-bench"
version = "0.1.0"
description = "Banc d'essai pour apprendre Dagster sur un pipeline musical partitionne par jour"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.13.28",
    "dagster-webserver>=1.13.28",
    "pandas>=2.0.0",
    "faker>=24.0.0",
    "pyarrow>=12.0.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "dagster-dg-cli>=1.13.28",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["streamify_ops*"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "streamify_ops"
# Meme nom que `dagster ... -m streamify_ops.definitions` : l'etat des schedules
# et des sensors demarres en ligne de commande reste celui de l'interface.
code_location_name = "streamify_ops.definitions"

[tool.black]
line-length = 88
target-version = ["py312"]
