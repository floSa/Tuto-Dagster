[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dagster-test-bench"
version = "0.1.0"
description = "Banc d'essai pour apprendre Dagster sur un pipeline musical partitionne par jour"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.13.28",
    "dagster-webserver>=1.13.28",
    "pandas>=2.0.0",
    "faker>=24.0.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["streamify_ops*"]

[tool.black]
line-length = 88
target-version = ["py312"]
